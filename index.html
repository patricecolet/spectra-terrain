<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Langmuir</title>
  <style>
    :root {
      color-scheme: dark;
    }
    html, body {
      margin: 0; padding: 0; overflow: hidden; height: 100%;
      background: #05070d;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    #backdrop {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(180deg, rgba(5,7,13,0.55) 0%, rgba(5,7,13,0.25) 30%, rgba(5,7,13,0.55) 75%, rgba(5,7,13,0.92) 100%),
        url('/album/cover.jpg');
      background-size: cover;
      background-position: center;
    }
    canvas {
      position: relative; z-index: 1; display: block;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    canvas.active { opacity: 1; }

    #top-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center;
      padding: 18px 12px 10px;
      gap: 14px;
      background: linear-gradient(180deg, rgba(5,7,13,0.75), rgba(5,7,13,0));
      pointer-events: none;
    }
    #logo {
      height: 46px;
      opacity: 0.95;
      filter: brightness(0) invert(1) drop-shadow(0 2px 10px rgba(0,0,0,0.8));
      pointer-events: auto;
      cursor: pointer;
    }
    #tracklist {
      display: flex; flex-wrap: wrap; justify-content: center;
      gap: 6px 4px;
      max-width: 1000px;
      pointer-events: auto;
    }
    .track-btn {
      background: rgba(15, 20, 35, 0.55);
      border: 1px solid rgba(207, 232, 255, 0.18);
      border-radius: 5px;
      padding: 6px 10px;
      cursor: pointer;
      display: flex;
      align-items: flex-end;
      transition: background 0.15s, border-color 0.15s, transform 0.15s;
    }
    .track-btn:hover {
      background: rgba(35, 55, 90, 0.65);
      border-color: rgba(207, 232, 255, 0.4);
      transform: translateY(-1px);
    }
    .track-btn.active {
      background: rgba(60, 130, 200, 0.35);
      border-color: #7fc4ff;
    }
    .track-btn img.glyph {
      width: auto;
      display: block;
      filter: brightness(0) invert(1);
      opacity: 0.85;
    }
    .track-btn.active img.glyph { opacity: 1; }
    .track-btn .glyph-row { display: flex; align-items: flex-end; gap: 1px; }

    #center-stage {
      position: fixed; inset: 0; z-index: 5;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 28px;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }
    #center-stage.hidden { opacity: 0; pointer-events: none; }
    #big-logo {
      width: min(80vw, 640px);
      filter: brightness(0) invert(1) drop-shadow(0 6px 30px rgba(0,0,0,0.8));
    }
    #now-playing {
      position: fixed; left: 14px; bottom: 14px; z-index: 10;
      display: flex; align-items: center; gap: 10px;
      background: rgba(5, 7, 13, 0.55);
      padding: 8px 12px; border-radius: 8px;
      opacity: 0; transform: translateY(6px);
      transition: opacity 0.4s, transform 0.4s;
    }
    #now-playing.visible { opacity: 1; transform: translateY(0); }
    #now-playing .glyph-row { display: flex; align-items: flex-end; gap: 1px; }
    #now-playing .glyph-row img.glyph { width: auto; display: block; filter: brightness(0) invert(1); }
    #view-toggle, #mode-toggle, #stop-btn {
      background: #12203a; color: #cfe8ff; border: 1px solid #2a4166;
      border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer;
    }
    #view-toggle:hover, #mode-toggle:hover, #stop-btn:hover { background: #1a2e52; }
    #stop-btn { color: #ffb3b3; border-color: #4a2a2a; }
    #stop-btn:hover { background: #3a1a1a; }
    #now-playing-volume-wrap {
      display: flex; align-items: center; gap: 6px;
      background: #12203a; border: 1px solid #2a4166; border-radius: 6px;
      padding: 5px 10px; font-size: 12px; color: #cfe8ff;
    }
    #now-playing-volume { width: 70px; accent-color: #7fc4ff; }

    #tuning-toggle {
      position: fixed; right: 14px; bottom: 14px; z-index: 11;
      background: rgba(5, 7, 13, 0.6);
      border: 1px solid rgba(207, 232, 255, 0.15);
      border-radius: 8px;
      width: 30px; height: 30px;
      color: #cfe8ff; font-size: 14px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    #tuning-toggle:hover { background: rgba(35, 55, 90, 0.65); }
    #game-toggle {
      position: fixed; right: 52px; bottom: 14px; z-index: 11;
      background: rgba(5, 7, 13, 0.6);
      border: 1px solid rgba(207, 232, 255, 0.15);
      border-radius: 8px;
      width: 30px; height: 30px;
      color: #cfe8ff; font-size: 14px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    #game-toggle:hover { background: rgba(35, 55, 90, 0.65); }
    #game-toggle.active { background: rgba(60, 130, 200, 0.45); border-color: #7fc4ff; }
    #game-score {
      position: fixed; right: 90px; bottom: 14px; z-index: 11;
      background: rgba(5, 7, 13, 0.6);
      border: 1px solid rgba(207, 232, 255, 0.15);
      border-radius: 8px;
      padding: 0 12px; height: 30px;
      color: #ffc94d; font-size: 13px; font-weight: 600;
      display: flex; align-items: center;
    }
    #game-score.hidden { display: none; }
    #tuning {
      position: fixed; right: 14px; bottom: 52px; z-index: 10;
      background: rgba(5, 7, 13, 0.6);
      border: 1px solid rgba(207, 232, 255, 0.15);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex; flex-direction: column; gap: 8px;
      color: #cfe8ff; font-size: 11px;
      min-width: 170px;
      transition: opacity 0.2s, transform 0.2s;
      transform-origin: bottom right;
    }
    #tuning.hidden {
      opacity: 0; transform: scale(0.95);
      pointer-events: none;
    }
    #tuning label {
      display: flex; flex-direction: column; gap: 3px;
    }
    #tuning label.check {
      flex-direction: row; align-items: center; gap: 6px;
      cursor: pointer; opacity: 0.85;
    }
    #tuning label.check input { margin: 0; accent-color: #7fc4ff; }
    #tuning .row { display: flex; justify-content: space-between; opacity: 0.8; }
    #tuning input[type="range"] { width: 100%; }
    #tuning details {
      display: flex; flex-direction: column; gap: 8px;
    }
    #tuning details + details {
      border-top: 1px solid rgba(207, 232, 255, 0.15);
      padding-top: 8px;
    }
    #tuning summary {
      cursor: pointer; user-select: none;
      display: flex; justify-content: space-between; align-items: center;
      font-weight: 600; opacity: 0.9;
    }
    #tuning summary::-webkit-details-marker { display: none; }
    #tuning summary::after {
      content: '▾'; font-size: 9px; opacity: 0.6; transition: transform 0.15s;
    }
    #tuning details:not([open]) summary::after { transform: rotate(-90deg); }
    .style-btn {
      flex: 1;
      background: #12203a; color: #cfe8ff; border: 1px solid #2a4166;
      border-radius: 5px; padding: 5px 6px; font-size: 11px; cursor: pointer;
    }
    .style-btn:hover { background: #1a2e52; }
    .style-btn.active { background: rgba(60, 130, 200, 0.45); border-color: #7fc4ff; }

    #password-overlay {
      position: fixed; inset: 0; z-index: 20;
      background: rgba(5, 7, 13, 0.7);
      display: flex; align-items: center; justify-content: center;
    }
    #password-overlay.hidden { display: none; }
    #password-box {
      background: rgba(10, 14, 24, 0.95);
      border: 1px solid rgba(207, 232, 255, 0.2);
      border-radius: 10px;
      padding: 18px 20px;
      display: flex; flex-direction: column; gap: 10px;
      color: #cfe8ff; font-size: 13px;
      min-width: 220px;
    }
    #password-input {
      background: #0c1220; color: #cfe8ff;
      border: 1px solid #2a4166; border-radius: 6px;
      padding: 7px 9px; font-size: 13px;
    }
    #password-error {
      color: #ff8f8f; font-size: 11px; min-height: 1.2em;
    }
    #password-actions { display: flex; gap: 8px; justify-content: flex-end; }
    #password-actions button {
      background: #12203a; color: #cfe8ff; border: 1px solid #2a4166;
      border-radius: 6px; padding: 5px 12px; font-size: 12px; cursor: pointer;
    }
    #password-actions button:hover { background: #1a2e52; }
    #password-submit { background: rgba(60, 130, 200, 0.45); border-color: #7fc4ff; }
  </style>
</head>
<body>
  <div id="backdrop"></div>

  <div id="top-bar">
    <img id="logo" src="/album/logo.png" alt="Langmuir" />
    <div id="tracklist"></div>
  </div>

  <div id="center-stage">
    <img id="big-logo" src="/album/logo.png" alt="Langmuir" />
  </div>

  <div id="now-playing">
    <div class="glyph-row" id="now-playing-title"></div>
    <button id="view-toggle">vue : vallée au milieu</button>
    <button id="mode-toggle">vue : terrain</button>
    <div id="now-playing-volume-wrap">
      <span>volume</span>
      <input type="range" id="now-playing-volume" min="0" max="1" step="0.01" autocomplete="off" />
    </div>
    <button id="stop-btn">stop</button>
  </div>

  <button id="tuning-toggle" title="réglages (shift+clic)">⚙</button>
  <button id="game-toggle" title="jeu (flèches)">🎮</button>
  <div id="game-score" class="hidden">score : <span id="game-score-val">0</span></div>

  <div id="password-overlay" class="hidden">
    <div id="password-box">
      <span>mot de passe</span>
      <input type="password" id="password-input" autocomplete="off" />
      <div id="password-error"></div>
      <div id="password-actions">
        <button id="password-cancel" type="button">annuler</button>
        <button id="password-submit" type="button">valider</button>
      </div>
    </div>
  </div>
  <div id="tuning" class="hidden">
    <details>
      <summary>terrain</summary>
      <label>
        <span class="row"><span>largeur</span><span id="tuning-width-val"></span></span>
        <input type="range" id="tuning-width" min="10" max="60" step="1" autocomplete="off" />
      </label>
      <label>
        <span class="row"><span>hauteur</span><span id="tuning-amplitude-val"></span></span>
        <input type="range" id="tuning-amplitude" min="0" max="20" step="0.5" autocomplete="off" />
      </label>
      <label>
        <span class="row"><span>courbe (profondeur)</span><span id="tuning-curve-val"></span></span>
        <input type="range" id="tuning-curve" min="-10" max="10" step="0.5" autocomplete="off" />
      </label>
    </details>
    <details>
      <summary>couleur</summary>
      <label>
        <span class="row"><span>coloration (vert ↔ bleu)</span><span id="tuning-hue-val"></span></span>
        <input type="range" id="tuning-hue" min="-1" max="1" step="0.05" autocomplete="off" />
      </label>
      <label class="check">
        <input type="checkbox" id="tuning-hue-link" checked autocomplete="off" />
        <span>reliée à la courbe</span>
      </label>
      <label>
        <span class="row"><span>saturation (n&b ↔ vif)</span><span id="tuning-saturation-val"></span></span>
        <input type="range" id="tuning-saturation" min="-1" max="1" step="0.05" autocomplete="off" />
      </label>
      <label class="check">
        <input type="checkbox" id="tuning-saturation-link" checked autocomplete="off" />
        <span>reliée à la largeur</span>
      </label>
      <label>
        <span class="row"><span>brillance (glow ↔ chromé)</span><span id="tuning-brilliance-val"></span></span>
        <input type="range" id="tuning-brilliance" min="-1" max="1" step="0.05" autocomplete="off" />
      </label>
      <label class="check">
        <input type="checkbox" id="tuning-brilliance-link" checked autocomplete="off" />
        <span>reliée à la hauteur</span>
      </label>
      <label class="check">
        <input type="checkbox" id="tuning-backdrop-link" checked autocomplete="off" />
        <span>coloration/saturation/brillance aussi sur le fond</span>
      </label>
    </details>
    <details>
      <summary>ambiance</summary>
      <label>
        <span class="row"><span>brouillard (transparent ↔ dense)</span><span id="tuning-fog-val"></span></span>
        <input type="range" id="tuning-fog" min="-1" max="1" step="0.05" autocomplete="off" />
      </label>
      <label>
        <span class="row"><span>vibration (mou ↔ dur)</span><span id="tuning-vibration-val"></span></span>
        <input type="range" id="tuning-vibration" min="-1" max="1" step="0.05" autocomplete="off" />
      </label>
    </details>
    <details>
      <summary>texture</summary>
      <div id="tuning-style-group" style="display: flex; gap: 4px;">
        <button class="style-btn" data-style="0">lisse</button>
        <button class="style-btn" data-style="1">dessiné</button>
      </div>
    </details>
    <details>
      <summary>automatique</summary>
      <label class="check">
        <input type="checkbox" id="tuning-auto" checked autocomplete="off" />
        <span>réglages automatiques</span>
      </label>
      <label>
        <span class="row"><span>vitesse</span><span id="tuning-auto-speed-val"></span></span>
        <input type="range" id="tuning-auto-speed" min="0.1" max="3" step="0.1" value="0.1" autocomplete="off" />
      </label>
    </details>
    <details>
      <summary>lecture</summary>
      <label>
        <span class="row"><span>volume</span><span id="tuning-volume-val"></span></span>
        <input type="range" id="tuning-volume" min="0" max="1" step="0.01" autocomplete="off" />
      </label>
      <label class="check">
        <input type="checkbox" id="tuning-autochain" autocomplete="off" />
        <span>enchaînement automatique</span>
      </label>
      <div class="row" style="margin-top: 2px;">morceaux affichés</div>
      <div id="tuning-tracks-group"></div>
    </details>
    <details>
      <summary>arbres</summary>
      <label>
        <span class="row"><span>densité</span><span id="tuning-tree-density-val"></span></span>
        <input type="range" id="tuning-tree-density" min="0.2" max="3" step="0.1" autocomplete="off" />
      </label>
    </details>
    <details>
      <summary>immeubles</summary>
      <label>
        <span class="row"><span>seuil (profil)</span><span id="tuning-buildings-threshold-val"></span></span>
        <input type="range" id="tuning-buildings-threshold" min="0" max="1.2" step="0.01" autocomplete="off" />
      </label>
      <label>
        <span class="row"><span>courbe hauteur (dynamique)</span><span id="tuning-buildings-gamma-val"></span></span>
        <input type="range" id="tuning-buildings-gamma" min="0.5" max="6" step="0.1" autocomplete="off" />
      </label>
      <label>
        <span class="row"><span>couleur selon amplitude</span><span id="tuning-buildings-color-val"></span></span>
        <input type="range" id="tuning-buildings-color" min="0" max="1" step="0.01" autocomplete="off" />
      </label>
      <label>
        <span class="row"><span>îlots (nombre)</span><span id="tuning-buildings-cluster-count-val"></span></span>
        <input type="range" id="tuning-buildings-cluster-count" min="0" max="10" step="1" autocomplete="off" />
      </label>
      <label>
        <span class="row"><span>îlots (taille max, blocs)</span><span id="tuning-buildings-cluster-size-val"></span></span>
        <input type="range" id="tuning-buildings-cluster-size" min="2" max="8" step="1" autocomplete="off" />
      </label>
    </details>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
